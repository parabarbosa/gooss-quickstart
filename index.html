<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pesquisa na Planilha</title>
  <script type="text/javascript" src="https://www.google.com/jsapi"></script>
  <script type="text/javascript" src="underscore-min.js"></script>
  <script type="text/javascript" src="gooss.js"></script>
  <script type="text/javascript">
    var url = "https://docs.google.com/spreadsheets/d/1jnM_18e4PgvhWWkVut9cyoRyTd5xk504ntVpqL_8evg/gviz/tq?tqx=out:json";

    function searchTerm() {
      var searchQuery = document.getElementById("search").value.toLowerCase();
      if (!searchQuery) return;
      
      gooss.data({ transcricoes: { url: url, index: 0 } }, function(err, data) {
        if (err) {
          document.getElementById("results").innerHTML = "Erro ao carregar os dados: " + err;
          return;
        }
        
        var results = data.transcricoes.filter(row => row["Transcrição"].toLowerCase().includes(searchQuery));
        
        var output = "<table border='1'><tr><th>Título - Vídeo</th><th>Timecode - Autor</th></tr>";
        results.forEach(row => {
          output += `<tr>
            <td>${row["Titulo - Video"]}</td>
            <td><a href="${row["URL_LINK"]}" target="_blank">${row["Timecode - Autor"]}</a></td>
          </tr>`;
        });
        output += "</table>";
        document.getElementById("results").innerHTML = output;
      });
    }
  </script>
</head>
<body>
  <h1>Pesquisa na Planilha</h1>
  <input type="text" id="search" placeholder="Digite um termo...">
  <button onclick="searchTerm()">Pesquisar</button>
  <div id="results"></div>
</body>
</html>
